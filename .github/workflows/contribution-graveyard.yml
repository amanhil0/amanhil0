name: Animate the contribution graveyard

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/render_contributions.py'
      - '.github/workflows/contribution-graveyard.yml'

permissions:
  contents: write

concurrency:
  group: contribution-graveyard
  cancel-in-progress: false

jobs:
  animate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the renderer dependency
        run: python -m pip install 'Pillow>=10,<13'
      - name: Render the real public contribution calendar
        run: python scripts/render_contributions.py --username amanhil0
      - name: Save the refreshed animation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/contribution-graveyard.gif
          if git diff --cached --quiet; then
            echo 'The contribution graveyard is already current.'
          else
            git commit -m 'Refresh the animated contribution graveyard'
            git push
          fi
